services:
  - type: cron
    name: unified-gateway
    runtime: python
    pythonVersion: 3.11
    buildCommand: pip install -r requirements.txt
    startCommand: python unified_gateway.py
    plan: free
    scheduleFrequency: every 10 mins
    envVars:
      # Firebase
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        value: aye-commercial-4b871.firebasestorage.app

      # Instagram
      - key: INSTAGRAM_USERNAME
        value: ayemarket2
      - key: INSTAGRAM_PASSWORD
        sync: false

