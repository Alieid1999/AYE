<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Glowing Screen Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glass Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="url(#primaryGrad)" stroke-width="6" stroke-opacity="0.4"/>

  <!-- Subtle Tech Grid / Circuit Accents -->
  <path d="M70 120 H120 V170 M442 120 H392 V170 M70 392 H120 V342 M442 392 H392 V342" 
        stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>
  <circle cx="120" cy="170" r="4" fill="#38bdf8" opacity="0.5"/>
  <circle cx="392" cy="170" r="4" fill="#38bdf8" opacity="0.5"/>

  <!-- LAPTOP SCREEN SHELL -->
  <!-- Outer Bezel -->
  <rect x="116" y="90" width="280" height="190" rx="16" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <!-- Inner Display Area -->
  <rect x="128" y="102" width="256" height="166" rx="10" fill="url(#screenGrad)"/>

  <!-- Screen Tech Glow Circle -->
  <circle cx="256" cy="180" r="62" fill="url(#primaryGrad)" opacity="0.15" filter="url(#neonGlow)"/>

  <!-- Screen Content: Stylized 'A' Laboratory Emblem -->
  <!-- Stylized Modern 'A' Vector -->
  <path d="M256 126 L298 228 H214 Z" fill="none" stroke="url(#primaryGrad)" stroke-width="10" stroke-linejoin="round" filter="url(#neonGlow)"/>
  <!-- Crossbar of 'A' / Circuit line -->
  <path d="M228 196 H284" stroke="#38bdf8" stroke-width="7" stroke-linecap="round"/>
  <!-- Beaker / Core dot in 'A' -->
  <circle cx="256" cy="168" r="6" fill="#38bdf8" filter="url(#neonGlow)"/>

  <!-- Laptop Hinge -->
  <rect x="220" y="278" width="72" height="10" rx="4" fill="url(#metalGrad)"/>

  <!-- LAPTOP BASE / KEYBOARD BODY -->
  <!-- Perspective Lower Deck -->
  <path d="M76 304 L116 284 H396 L436 304 C440 307 442 312 440 316 L430 336 C428 340 424 344 418 344 H94 C88 344 84 340 82 336 L72 316 C70 312 72 307 76 304 Z" 
        fill="#1e293b" stroke="#475569" stroke-width="4"/>

  <!-- Trackpad Notch & Deck Detail -->
  <rect x="216" y="318" width="80" height="18" rx="5" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <line x1="130" y1="298" x2="382" y2="298" stroke="url(#primaryGrad)" stroke-width="3" stroke-linecap="round" opacity="0.8" filter="url(#neonGlow)"/>

  <!-- Brand Typography: A LAB -->
  <text x="256" y="420" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" 
        fill="#ffffff" text-anchor="middle" letter-spacing="6">A LAB</text>
  <text x="256" y="454" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" 
        fill="#38bdf8" text-anchor="middle" letter-spacing="4">LAPTOPS &amp; ACCESSORIES</text>
</svg>
